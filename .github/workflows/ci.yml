name: CI

# Checks only (spec E-D3). Pull requests and pushes to main, and nothing else.
#
# **This workflow must never deploy, publish, or release.** This repository had no
# pipeline at all before 2026-08-04; the first one must not be something that
# ships code as a side effect of a merge. Adding delivery later is a decision
# somebody should make deliberately, in its own file, with its own review — not
# something that accretes onto a check job.
#
# It is also written to need **no secrets**, so a pull request from a fork runs
# the same checks as one from a branch. A CI job that silently skips its real
# work on external contributions is worse than none: it reports green.
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref. Pushing three times to a PR should not
# queue three full runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` and not `npm install`: the point of CI is to run against the
      # lockfile, not against whatever resolves today.
      - name: Install
        run: npm ci

      # The server imports `@prisma/client` at module load, so the generated
      # client must exist before anything typechecks. `npm ci` runs the server's
      # postinstall, which does this — but it is repeated explicitly because a
      # missing client fails with a type error about a package that is installed,
      # which is a genuinely confusing thing to debug from a CI log.
      - name: Generate Prisma client
        run: npm run db:generate --workspace app/server

      - name: Typecheck (all workspaces)
        run: npm run typecheck --workspaces --if-present

      - name: Lint (client)
        run: npm run lint --workspace app/client

      # All suites are pure functions — no database, no server, no .env. If a
      # test here ever needs one of those, it is an integration test and this job
      # gains a service container as a deliberate, reviewed change.
      - name: Test (all workspaces)
        run: npm run test --workspaces --if-present

      - name: Build (client)
        run: npm run build --workspace app/client

      - name: Build (server)
        run: npm run build --workspace app/server

      # Production manifest: no host_permissions, no static content_scripts. The
      # e2e build (localhost pre-granted) is for the harness only and never ships.
      - name: Build (extension)
        run: npm run build --workspace app/extension

      # A successful build says nothing about what it asks the browser for.
      - name: Check shipped manifest (extension)
        run: npm run check:manifest --workspace app/extension

  # The extension in a real browser, against the real API and web app: what the
  # unit suites cannot see (registration, content-script worlds, storage access,
  # the panel). Separate from `check` because it needs a database and a display,
  # and a failure here should not hide a type error there.
  #
  # Still no secrets: the database lives only for this job, and every value below
  # is a throwaway written in plain sight.
  extension-browser:
    name: extension in Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: apexops_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/apexops_ci?schema=public
      NODE_ENV: development
      JWT_SECRET: ci-only-access-secret-not-used-anywhere-else
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-used-anywhere-else
      # The checks sign in many times from one address.
      RATE_LIMIT_AUTH_MAX_LOGIN: '200'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # Puppeteer lives in the server workspace and pins the Chrome it drives.
      - name: Install Chrome for Testing
        run: npx puppeteer browsers install chrome
        working-directory: app/server

      # Ubuntu 24.04 blocks the unprivileged user namespaces Chrome's sandbox
      # uses. Allowing them keeps the sandbox on, instead of passing --no-sandbox.
      - name: Allow Chrome's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Prepare database
        run: |
          npm run db:generate --workspace app/server
          (cd app/server && npx prisma db push --skip-generate)
          npm run seed:dev --workspace app/server

      - name: Start the API and the web app
        run: |
          PORT=3013 WS_PORT=8099 CORS_ORIGIN=http://localhost:5199             nohup npm run dev --workspace app/server > "$RUNNER_TEMP/api.log" 2>&1 &
          PORT=5199 VITE_API_URL=http://localhost:3013 VITE_WS_URL=http://localhost:8099             nohup npm run dev --workspace app/client > "$RUNNER_TEMP/web.log" 2>&1 &
          for url in http://localhost:3013/api/health http://localhost:5199/apexops.json; do
            curl --fail --silent --show-error --output /dev/null               --retry 60 --retry-delay 2 --retry-all-errors "$url"
          done

      - name: Seed the project the checks use
        run: node .agents/harness/browser-extension/checks/ci-seed.mjs

      # Pre-grants localhost, so a script can bind a site. Never shipped.
      - name: Build (extension, e2e)
        run: npm run build:e2e --workspace app/extension

      - name: Capture and delivery (p3)
        run: xvfb-run --auto-servernum node .agents/harness/browser-extension/checks/p3-extension.mjs

      - name: Connect by project URL (p4)
        run: xvfb-run --auto-servernum node .agents/harness/browser-extension/checks/p4-extension.mjs

      - name: Toolbar, panel and hardening (p5a)
        run: xvfb-run --auto-servernum node .agents/harness/browser-extension/checks/p5a-rail.mjs

      - name: Server and web app logs
        if: failure()
        run: |
          echo '--- API'; tail -n 200 "$RUNNER_TEMP/api.log" || true
          echo '--- web'; tail -n 100 "$RUNNER_TEMP/web.log" || true
